<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>종목 딥리서치 · RICHFLOW</title>
<link rel="stylesheet" href="community.css">
<style>
  :root{--bg:#e5e6ea;--card:#f4f5f7;--card2:#e9ebef;--line:#d3d6dd;--txt:#1b1e24;--txt2:#474d58;--txt3:#68707c;--brand:#434955;--green:#1f9d57;--red:#d8455a;--shadow:0 10px 30px rgba(60,66,80,.1)}
  *{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--txt);line-height:1.55;letter-spacing:-.01em}a{text-decoration:none;color:inherit}.wrap{max-width:1080px;margin:auto;padding:0 20px}
  header{position:sticky;top:0;z-index:20;background:rgba(229,230,234,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.nav{height:64px;display:flex;align-items:center;gap:12px}.logo{font-size:19px;font-weight:850}.back{margin-left:auto;padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:13px;font-weight:750}
  main{padding:34px 0 70px}.eyebrow{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:800;color:var(--txt3)}.pill{background:var(--brand);color:#fff;border-radius:20px;padding:5px 10px}.ticker{font-family:ui-monospace,monospace;color:var(--brand)}h1{font-size:34px;line-height:1.25;margin:13px 0 10px}.lead{font-size:16px;color:var(--txt2);max-width:760px}.stamp{margin-top:14px;font-size:12px;color:var(--txt3)}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.focus{margin-top:24px;background:var(--card2);border:1px solid var(--line);border-radius:15px;padding:18px}.focus .label{font-size:11px;font-weight:850;color:var(--txt3);margin-bottom:5px}.focus strong{font-size:18px}
  .grid{display:grid;grid-template-columns:1.35fr .8fr;gap:20px;margin-top:20px}.stack{display:flex;flex-direction:column;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:0 2px 8px rgba(60,66,80,.06)}.card h2{font-size:17px;margin-bottom:13px}.checks{display:flex;flex-direction:column;gap:10px;counter-reset:item}.check{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;color:var(--txt2);font-size:14px}.check:before{counter-increment:item;content:counter(item);display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font-weight:850;font-size:12px}.risk{border-left:4px solid var(--red)}.risk p,.copy{color:var(--txt2);font-size:14px}.source{display:flex;flex-direction:column;gap:4px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}.source:last-child{border:0}.source span{font-size:11px;color:var(--txt3)}
  .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--line);background:var(--card2);padding:10px 14px;border-radius:11px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.notice{font-size:11px;color:var(--txt3);margin-top:18px;line-height:1.65}
  @media(max-width:760px){h1{font-size:27px}.grid{grid-template-columns:1fr}.hero{padding:21px}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="logo" href="index.html">🤖 RICHFLOW</a><a class="back" id="backLink" href="research.html">← 종목 다시 고르기</a></div></header>
<main class="wrap" id="app"></main>
<script src="research-all-data.js"></script>
<script src="research-universe.js"></script>
<script src="community.js"></script>
<script>
  const q=new URLSearchParams(location.search);
  const market=q.get('m')==='us'?'us':'kr';
  const code=(q.get('code')||'').toUpperCase();
  const curated=(window.RICHFLOW_RESEARCH_UNIVERSE||{})[market]||[];
  const curatedByCode=new Map(curated.map(x=>[x.code,x]));
  const raw=(window.RICHFLOW_ALL_LISTED||{})[market]||[];
  const sectorForKr=industry=>{
    const value=String(industry||'');
    if(/반도체|소프트웨어|정보 서비스|정보서비스|자료처리|컴퓨터 프로그래밍|시스템 통합|컴퓨터 및 주변장치|전자부품|통신 및 방송 장비|마그네틱 및 광학 매체|영상 및 음향기기|정밀기기/.test(value))return '기술';
    if(/금융|은행|보험|신탁|증권|연금|투자/.test(value))return '금융';
    if(/의약|바이오|의료|보건|병원/.test(value))return '헬스케어';
    if(/식료품|음료|담배|농업|어업|축산|사료|도축|육류|수산물|곡물|작물|농·축산물/.test(value))return '필수소비재';
    if(/자동차|섬유|의복|가죽|신발|가구|숙박|음식점|여행|레저|스포츠|개인 및 가정용품|소매업|교육|오락|예술|화장품/.test(value))return '경기소비재';
    if(/부동산/.test(value))return '부동산';
    if(/전기업|증기, 냉·온수|수도|하수|폐기물/.test(value))return '유틸리티';
    if(/석유|가스 제조|연료|에너지/.test(value))return '에너지';
    if(/화학|철강|금속|비금속|광물|종이|목재|플라스틱|고무|유리|시멘트/.test(value))return '소재';
    if(/출판|방송|영화|오디오|광고|전기 통신업|우편|창작/.test(value))return '커뮤니케이션';
    if(/기계|장비|건설|운송|선박|항공|창고|물류|전기장비|공사업|엔지니어링|시설/.test(value))return '산업재';
    return '기타';
  };
  const list=raw.map(row=>{
    const base=market==='us'
      ?{code:row[0],name:row[1],segment:row[2]||'US',category:row[2]||'미국 상장기업',industry:row[2]||'미국 상장기업',cik:row[3],focus:'최근 실적·현금흐름·SEC 공시 이벤트',risk:'실적 추정치와 업종 사이클'}
      :{code:row[0],name:row[1],segment:row[2],category:row[2],industry:row[3]||'상장기업',product:row[4]||'',focus:(row[3]||'상장기업')+' · 최근 실적·현금흐름·DART 공시 이벤트',risk:'최근 공시와 업종 사이클'};
    return {...base,...(curatedByCode.get(base.code)||{}),segment:base.segment,industry:base.industry};
  });
  const normalizedList=list.map((entry,index)=>{
    const row=raw[index]||[];
    const sector=market==='us'?(row[4]||'기타'):sectorForKr(row[3]);
    const industry=market==='us'?(row[5]||'미분류'):(row[3]||'미분류');
    return {...entry,sector,industry,category:sector,guideCategory:entry.category};
  });
  const item=normalizedList.find(x=>x.code.toUpperCase()===code)||normalizedList[0];
  const back='research.html'+(market==='us'?'?m=us':'');
  document.getElementById('backLink').href=back+'#research-picker';
  const regulatory=market==='us'
    ?{label:'SEC EDGAR · 법정 공시 검색',url:item.cik?'https://www.sec.gov/edgar/browse/?CIK='+encodeURIComponent(item.cik):'https://www.sec.gov/edgar/search/#/q='+encodeURIComponent(item.code),meta:'10-K · 10-Q · 8-K · Form 4 · 13D/G'}
    :{label:'금융감독원 DART · 기업 공시',url:'https://dart.fss.or.kr/',meta:'사업·분기보고서 · 수주 · 지분 · 자사주'};
  const ir={label:item.name+' · 공식 IR',url:item.ir||regulatory.url,meta:'실적발표 · 가이던스 · 프레젠테이션'};
  const guides=window.RICHFLOW_RESEARCH_GUIDES[item.guideCategory]||window.RICHFLOW_RESEARCH_GUIDES[item.sector]||window.RICHFLOW_RESEARCH_GUIDES.default;
  const stockUrl=market==='us'?'stock-us.html?t='+encodeURIComponent(item.code):'stock.html?code='+encodeURIComponent(item.code);
  const articleUrl=item.articleId?'article.html?m='+market+'&id='+encodeURIComponent(item.articleId):'';
  document.title=item.name+' 딥리서치 · RICHFLOW';
  document.getElementById('app').innerHTML=`
    <section class="hero">
      <div class="eyebrow"><span class="pill">${market==='us'?'미장':'국장'} 단일종목 리서치</span><span>${item.sector} · ${item.industry}</span><span class="ticker">${item.code}</span></div>
      <h1>${item.name} 딥리서치</h1>
      <p class="lead">선택한 종목 하나만 분리해 공식 공시와 기업 IR에서 확인할 논점, 반대 근거, 다음 촉매를 정리했습니다.</p>
      <div class="stamp">요청 종목 1개 · 원천 우선순위: 규제 공시 → 기업 IR → 공식 통계 → 라이선스 시세</div>
      <div class="focus"><div class="label">이번 리서치의 핵심 질문</div><strong>${item.focus}</strong></div>
      <div class="actions"><a class="btn primary" href="${stockUrl}">종목 허브 보기</a>${articleUrl?`<a class="btn" href="${articleUrl}">검증 완료 심층 글 보기</a>`:''}<button class="btn" id="save">＋ 관심 리서치 저장</button></div>
    </section>
    <div class="grid">
      <div class="stack">
        <section class="card"><h2>먼저 확인할 3가지</h2><div class="checks">${guides.map(x=>`<div class="check">${x}</div>`).join('')}</div></section>
        <section class="card"><h2>분석 프레임</h2><p class="copy"><b>실적:</b> 최근 분기 매출·영업이익·현금흐름을 전년 동기와 직전 분기로 나눠 확인합니다.</p><p class="copy" style="margin-top:10px"><b>촉매:</b> ${item.focus} 관련 공시가 실제 매출과 이익으로 전환되는 시점을 추적합니다.</p><p class="copy" style="margin-top:10px"><b>판단:</b> 호재의 크기보다 시장 기대치에 이미 반영된 정도와 다음 분기 추정치 변화를 우선합니다.</p></section>
        <section class="card risk"><h2>반드시 반대로 검증할 위험</h2><p>${item.risk}. 좋은 시나리오만 확인하지 않고 이 조건이 악화될 때 투자 가설이 깨지는지 먼저 확인해야 합니다.</p></section>
      </div>
      <aside class="stack">
        <section class="card"><h2>1차 원문</h2>${[regulatory,ir].map(s=>`<a class="source" href="${s.url}" target="_blank" rel="noopener noreferrer"><b>${s.label} ↗</b><span>${s.meta}</span></a>`).join('')}</section>
        <section class="card"><h2>데이터 신뢰도</h2><p class="copy"><b>현재 단계: 리서치 브리프</b></p><p class="copy" style="margin-top:8px">수치가 들어가는 최종 글은 기준일과 원문 링크가 확보된 항목만 사용합니다. 13F는 분기 지연자료, 장중 시세는 별도 라이선스 데이터로 표시합니다.</p></section>
      </aside>
    </div>
    <section id="researchDiscussion"></section>
    <p class="notice">본 화면은 선택 종목의 조사 범위와 검증 순서를 즉시 보여주는 리서치 브리프입니다. 매수·매도 권유가 아니며, 최신 수치가 필요한 항목은 연결된 공시 원문 기준일을 확인해야 합니다.</p>`;
  RichflowCommunity.mount('#researchDiscussion',{market,entityType:'research',entityId:item.code,ticker:item.code,stockName:item.name,sector:item.sector});
  const key='richflow:research:'+market+':'+item.code;
  const btn=document.getElementById('save');
  if(localStorage.getItem(key)==='1')btn.textContent='✓ 관심 리서치 저장됨';
  btn.onclick=()=>{const on=localStorage.getItem(key)!=='1';localStorage.setItem(key,on?'1':'0');btn.textContent=on?'✓ 관심 리서치 저장됨':'＋ 관심 리서치 저장';};
</script>
</body>
</html>
